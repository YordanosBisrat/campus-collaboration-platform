name: campus_collaboration_app
description: "Campus Skill Exchange App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management — Riverpod 3
  flutter_riverpod: ^3.0.0

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: HoltwoodOneSC
      fonts:
        - asset: assets/fonts/HoltwoodOneSC-Regular.ttf